<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>HSE WATCH</title><style>
:root{--bg:#f3f6fb;--card:#fff;--ink:#12233a;--muted:#65768a;--line:#d9e1eb;--accent:#0865bc;--bad:#bd263d;--warn:#9c6700;--good:#11784b}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:15px system-ui,-apple-system,Segoe UI,Arial;color:var(--ink)}button,input,textarea,select{font:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:10px;padding:10px 13px;background:#fff;color:var(--ink)}button:hover{border-color:#8fb3da}button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}button.danger{color:var(--bad)}button:disabled{opacity:.45;cursor:not-allowed}.shell{max-width:1180px;margin:auto}.top{position:sticky;top:0;z-index:2;background:#102c4c;color:#fff;padding:13px max(16px,calc((100vw - 1180px)/2));display:flex;align-items:center;gap:14px;flex-wrap:wrap}.logo{font-weight:800;letter-spacing:.4px;font-size:20px}.meta{font-size:12px;opacity:.8}.top button{background:#234b70;color:white;border-color:#52718e}.tabs{display:flex;gap:6px;overflow:auto;padding:12px 16px;border-bottom:1px solid var(--line);background:white}.tabs button{white-space:nowrap}.tabs button.active{background:var(--accent);color:#fff;border-color:var(--accent)}main{padding:18px 16px 56px}.card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:18px;margin-bottom:14px;box-shadow:0 2px 9px #15385c09}h1{font-size:24px;margin:0 0 9px}h2{font-size:19px;margin:0 0 12px}h3{font-size:16px;margin:0 0 10px}.small,.hint{color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.field{display:flex;flex-direction:column;gap:5px;flex:1;min-width:190px;margin-bottom:10px}.field label{font-size:13px;font-weight:650}input,textarea,select{width:100%;padding:11px;border:1px solid #bac9d9;background:#fff;border-radius:9px;color:var(--ink)}textarea{resize:vertical;min-height:75px}.badge{display:inline-block;background:#eaf0f7;color:#38526f;border-radius:99px;padding:4px 10px;font-size:12px;font-weight:650}.high{background:#fee0e4;color:#a0182e}.medium{background:#fff0ce;color:#845600}.low{background:#e2f4e9;color:#166b44}.alert{border:2px solid #d9364c;animation:pulse 1.5s ease-in-out infinite}@keyframes pulse{50%{box-shadow:0 0 0 5px #ea284c30}}@media(prefers-reduced-motion:reduce){.alert{animation:none}}.tile{display:block;width:100%;text-align:left;padding:16px;background:white;border-radius:12px}.tile strong{font-size:17px}.split{display:grid;grid-template-columns:minmax(220px,320px) 1fr;gap:15px}.item{padding:12px;border-bottom:1px solid var(--line)}.item:last-child{border-bottom:0}.question{padding:14px 0;border-bottom:1px solid var(--line)}.radio{display:inline-flex;gap:6px;align-items:center;margin-right:20px}.radio input{width:auto}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#15314d;color:white;padding:12px 16px;border-radius:10px;z-index:10;max-width:95vw}.badtext{color:var(--bad)}.goodtext{color:var(--good)}.stat{font-size:29px;font-weight:750}.modal{position:fixed;inset:0;background:#12233a8a;display:grid;place-items:center;z-index:5;padding:15px}.modal .card{max-width:560px;width:100%;max-height:90vh;overflow:auto}.empty{padding:22px;text-align:center;color:var(--muted)}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:13px}th,td{text-align:left;border-bottom:1px solid var(--line);padding:9px;vertical-align:top}th{background:#f4f7fb}.statusline{padding:8px 11px;background:#eaf3ff;border-radius:9px;font-size:13px;margin-bottom:12px}@media(max-width:680px){.split{display:block}.top{padding:11px 13px}.logo{font-size:18px}main{padding:12px}.card{padding:14px}.tabs{padding:9px}}
</style></head><body><header class="top"><div class="logo">🦺 HSE WATCH</div><div class="meta" id="identity">Connect to Supabase to start</div><div style="flex:1"></div><button id="configBtn">⚙ Connection</button><button id="logoutBtn" hidden>Sign out</button></header><div class="shell"><nav id="tabs" class="tabs" hidden></nav><main id="main"></main></div><div id="modalRoot"></div><div id="toastRoot"></div>
<script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
const uuid=v=>/^[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}$/i.test(v||'');
let sb=null,user=null,profile=null,tab='locations',state={locations:[],checklists:[],questions:[],assignments:[],profiles:[],inspections:[],observations:[],notifications:[],answers:[]},selected=null,answers={},manageLocation=null;
function toast(s){$('#toastRoot').innerHTML=`<div class="toast">${esc(s)}</div>`;setTimeout(()=>$('#toastRoot').replaceChildren(),3500)}
function modal(title,html){$('#modalRoot').innerHTML=`<div class="modal"><section class="card"><div class="row between"><h2>${esc(title)}</h2><button data-action="modal-close">✕</button></div>${html}</section></div>`}
function closeModal(){$('#modalRoot').replaceChildren()}
function getConfig(){try{return JSON.parse(localStorage.getItem('hw_config')||'{}')}catch{return {}}}
function is(r){return profile?.role===r}function loc(id){return state.locations.find(v=>v.id===id)}function name(id){return loc(id)?.name||'Unknown'}function children(id){return state.locations.filter(x=>x.parent_id===id&&x.active)}function assigned(id){return state.assignments.some(a=>a.user_id===user?.id&&a.location_id===id&&a.active)}
function cycleDay(){const now=new Date();const x=new Date(now.toLocaleString('en-US',{timeZone:'Asia/Dubai'}));x.setHours(x.getHours()-18);return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`}
const cycle=()=>cycleDay();
async function query(table,cols='*',filters=null){let q=sb.from(table).select(cols);if(filters)q=filters(q);const {data,error}=await q;if(error)throw error;return data||[]}
async function load(){if(!sb||!user)return;const names=['hw_locations','hw_checklists','hw_questions','hw_assignments','hw_profiles','hw_inspections','hw_observations','hw_notifications'];const res=await Promise.all(names.map(n=>query(n).then(data=>[n,data])));for(const [n,data] of res)state[n.replace('hw_','')]=data;profile=state.profiles.find(p=>p.user_id===user.id);if(!profile?.active)throw Error('User account is not active');render()}
async function boot(){const c=getConfig();if(!c.url||!c.key){showConfig();return}try{sb=createClient(c.url,c.key,{auth:{persistSession:true,autoRefreshToken:true}});const {data:{session},error:sessionError}=await sb.auth.getSession();if(sessionError)throw sessionError;if(!session){user=null;renderLogin();return}const {data:{user:u},error}=await sb.auth.getUser();if(error)throw error;user=u;if(user){await load()}else renderLogin()}catch(e){user=null;renderLogin(e.message)}}
function showConfig(){const c=getConfig();modal('Supabase connection',`<p class="hint">Enter the Supabase project URL and publishable key. Do not enter a secret/service-role key.</p><form id="configForm"><div class="field"><label>Project URL</label><input name="url" type="url" required value="${esc(c.url||'')}" placeholder="https://xxx.supabase.co"></div><div class="field"><label>Publishable key</label><input name="key" required value="${esc(c.key||'')}" placeholder="sb_publishable_..."></div><button class="primary">Save connection</button></form>`)}
function renderLogin(error=''){ $('#tabs').hidden=true;$('#identity').textContent='Not signed in';$('#logoutBtn').hidden=true;$('#main').innerHTML=`<section class="card" style="max-width:470px;margin:35px auto"><h1>Sign in</h1><p class="hint">Use the HSE WATCH application account created in Supabase Authentication.</p>${error?`<p class="badtext">${esc(error)}</p>`:''}<form id="loginForm"><div class="field"><label>Email</label><input name="email" type="email" required autocomplete="username"></div><div class="field"><label>Password</label><input name="password" type="password" required autocomplete="current-password"></div><button class="primary">Sign in</button></form></section>`}
function nav(){let v=[['locations','📍 Locations'],['observations','⚠ Observations'],['notifications',`🔔 Notifications (${state.notifications.filter(n=>n.user_id===user?.id&&!n.read_at).length})`]];if(is('admin'))v.push(['admin','⚙ Admin'],['scores','📊 Scores']);if(is('admin')||is('contractor'))v.push(['reports','📄 Reports']);$('#tabs').hidden=false;$('#tabs').innerHTML=v.map(([id,label])=>`<button data-tab="${id}" class="${tab===id?'active':''}">${esc(label)}</button>`).join('')}
function render(){if(!user||!profile)return renderLogin();$('#identity').textContent=`${profile.display_name||user.email} · ${profile.role}`;$('#logoutBtn').hidden=false;nav();let view=tab==='locations'?locationsPage():tab==='observations'?observationsPage():tab==='notifications'?notificationsPage():tab==='admin'?adminPage():tab==='scores'?scoresPage():reportsPage();$('#main').innerHTML=view}
function riskHigh(id){return state.observations.some(o=>o.location_id===id&&o.status==='open'&&o.category==='high')||state.locations.some(l=>l.parent_id===id&&riskHigh(l.id))}
function locationsPage(){let roots=state.locations.filter(l=>!l.parent_id&&l.active);let shown=selected?loc(selected):null;return `<div class="row between"><h1>Site locations</h1><span class="badge">Inspection cycle ${cycle()}</span></div><p class="hint">View all areas. Subcontractor checklist submissions are limited to assigned areas.</p><div class="split"><section class="card"><div class="field"><label>Search</label><input id="locSearch" placeholder="PR 102, Level 1, V119..."></div><div id="locResults">${roots.map(locationItem).join('')||'<div class="empty">No locations configured yet. Admin can add locations.</div>'}</div></section><section class="card" id="locDetails">${shown?locationDetails(shown):'<div class="empty">Select a location to view its levels and checklist.</div>'}</section></div>`}
function locationItem(l){return `<button class="tile ${riskHigh(l.id)?'alert':''}" data-action="select-loc" data-id="${l.id}"><div class="row between"><strong>${esc(l.name)}</strong>${riskHigh(l.id)?'<span class="badge high">⚠ High open</span>':''}</div><div class="hint">${children(l.id).length?`${children(l.id).length} sub-locations`:'Open location'} ${is('subcon')&&assigned(l.id)?' · Assigned to you':''}</div></button>`}
function locationDetails(l){let ch=children(l.id),temp=state.checklists.find(c=>c.id===l.checklist_id),inspection=state.inspections.find(i=>i.location_id===l.id&&i.user_id===user.id&&i.cycle_day===cycle()), obs=state.observations.filter(o=>o.location_id===l.id);return `<div class="row between"><h2>${esc(l.name)}</h2>${riskHigh(l.id)?'<span class="badge high">OPEN HIGH RISK</span>':''}</div>${l.parent_id?`<button data-action="select-loc" data-id="${l.parent_id}">← Parent</button>`:''}${ch.length?`<h3>Sub-locations</h3><div class="grid">${ch.map(locationItem).join('')}</div>`:`<p class="hint">${temp?'Checklist: '+esc(temp.name):'No checklist assigned yet.'}</p><p>${state.assignments.filter(a=>a.location_id===l.id&&a.active).map(a=>`<span class="badge">${esc(state.profiles.find(p=>p.user_id===a.user_id)?.display_name||'Assigned HSE')}</span>`).join(' ')}</p>${inspection?'<span class="badge low">Checklist submitted this cycle ✓</span>':(is('admin')||is('subcon'))&&temp&&((is('admin'))||assigned(l.id))?`<button class="primary" data-action="open-checklist" data-id="${l.id}">Start daily checklist</button>`:'<p class="hint">Checklist submission unavailable for this account or location.</p>'}`}${(is('contractor')||is('admin'))?`<button data-action="add-finding" data-id="${l.id}">+ Contractor observation</button>${state.inspections.filter(i=>i.location_id===l.id).map(i=>`<div class="item"><span class="small">${esc(state.profiles.find(p=>p.user_id===i.user_id)?.display_name||'Subcon HSE')} · ${esc(i.cycle_day)} · ${i.reviewed_at?'Verified':'Awaiting verification'}</span> ${!i.reviewed_at?`<button data-action="verify-inspection" data-id="${i.id}">Verify checklist</button>`:''}</div>`).join('')}`:''}<h3 style="margin-top:20px">Observations (${obs.length})</h3>${obs.map(observationItem).join('')||'<p class="hint">No observations recorded.</p>'}`}
function observationItem(o){let person=state.profiles.find(p=>p.user_id===o.reported_by)?.display_name||'User';return `<div class="item"><div class="row between"><b>${esc(o.description)}</b><span class="badge ${o.category||''}">${esc(o.category||'Unrated')}</span></div><div class="small">${esc(o.source)} · ${esc(person)} · ${esc(o.status)} · ${new Date(o.created_at).toLocaleDateString()}</div>${o.responsible_person?`<p class="small">Responsible: ${esc(o.responsible_person)}</p>`:''}${o.corrective_action?`<p>Corrective action: ${esc(o.corrective_action)}</p>`:''}<div class="row" style="margin-top:8px">${o.status==='open'&&(is('admin')||(is('subcon')&&o.assigned_subcon===user.id))?`<button data-action="correct" data-id="${o.id}">Enter corrective action</button>`:''}${o.status==='open'&&(is('contractor')||is('admin'))&&o.corrective_action?`<button class="primary" data-action="close" data-id="${o.id}">Verify & close</button>`:''}${o.source==='subcon'&&(is('contractor')||is('admin'))?`<button data-action="validate" data-id="${o.id}">${o.valid===null?'Validate finding':o.valid?'✓ Valid':'✕ Invalid'} / Risk</button>`:''}</div></div>`}
function checklistModal(locationId){const l=loc(locationId),qs=state.questions.filter(q=>q.checklist_id===l.checklist_id&&q.active).sort((a,b)=>a.position-b.position);if(!qs.length)return toast('No checklist questions configured');answers={};modal(`Checklist – ${l.name}`,`<p class="hint">All questions required. For every No, enter observation and responsible person.</p><form id="checklistForm" data-location="${l.id}">${qs.map((q,i)=>`<div class="question" data-qid="${q.id}"><b>${i+1}. ${esc(q.prompt)}</b><div class="row" style="margin-top:10px"><label class="radio"><input type="radio" name="q_${q.id}" value="yes" required> Yes</label><label class="radio"><input type="radio" name="q_${q.id}" value="no"> No</label></div><div class="noFields" hidden><div class="field"><label>Observation</label><textarea class="desc" placeholder="Describe the observation"></textarea></div><div class="field"><label>Responsible person</label><input class="resp" placeholder="Responsible person"></div></div></div>`).join('')}<button class="primary">Submit checklist</button></form>`)}
function observationsPage(){let list=state.observations.slice().sort((a,b)=>b.created_at.localeCompare(a.created_at));return `<div class="row between"><h1>All observations</h1><span class="badge">${list.filter(o=>o.status==='open').length} open</span></div><section class="card"><div class="field"><label>Filter</label><select id="obsFilter"><option value="all">All statuses</option><option value="open">Open</option><option value="closed">Closed</option><option value="high">Open high risk</option></select></div><div id="obsResults">${list.map(o=>`<div data-status="${o.status}" data-high="${o.category==='high'&&o.status==='open'}"><h3>${esc(name(o.location_id))}</h3>${observationItem(o)}</div>`).join('')||'<div class="empty">No observations yet</div>'}</div></section>`}
function notificationsPage(){const list=state.notifications.filter(n=>n.user_id===user.id).sort((a,b)=>b.created_at.localeCompare(a.created_at));return `<h1>Notifications</h1><section class="card">${list.map(n=>`<div class="item"><div class="row between"><b>${esc(n.message)}</b>${n.read_at?'<span class="badge">Read</span>':'<span class="badge high">New</span>'}</div><div class="small">${esc(n.cycle_day)}</div><div class="row"><button data-action="select-notification" data-id="${n.id}" data-loc="${n.location_id}">Open area</button>${!n.read_at?`<button data-action="read-notification" data-id="${n.id}">Mark read</button>`:''}</div></div>`).join('')||'<div class="empty">No notifications</div>'}</section><p class="hint">In-app notifications appear when you open the app. The 10:05 AM scheduled check must be enabled separately in Supabase.</p>`}
function adminPage(){if(!is('admin'))return '';return `<h1>Admin configuration</h1><div class="grid"><section class="card"><h2>Locations and levels</h2><div class="row"><button class="primary" data-action="new-location">+ Add location/level</button></div><div>${state.locations.map(l=>`<div class="item"><b>${esc(l.name)}</b> <span class="small">${l.parent_id?'Sub-location':'Top level'}</span><div class="row"><button data-action="edit-location" data-id="${l.id}">Edit</button><button data-action="delete-location" data-id="${l.id}" class="danger">Delete</button></div></div>`).join('')}</div></section><section class="card"><h2>Checklist templates</h2><button class="primary" data-action="new-checklist">+ Add checklist</button>${state.checklists.map(c=>`<div class="item"><b>${esc(c.name)}</b><div class="small">${state.questions.filter(q=>q.checklist_id===c.id&&q.active).length} questions</div><div class="row"><button data-action="edit-checklist" data-id="${c.id}">Edit questions</button><button class="danger" data-action="delete-checklist" data-id="${c.id}">Delete</button></div></div>`).join('')}</section><section class="card"><h2>Users and roles</h2><p class="hint">Create the sign-in account under Supabase → Authentication → Users. The account appears here automatically.</p>${state.profiles.map(p=>`<div class="item"><b>${esc(p.display_name||p.user_id)}</b><div class="small">${esc(p.role)} ${p.active?'':'· inactive'}</div><button data-action="edit-user" data-id="${p.user_id}">Manage user</button></div>`).join('')}</section><section class="card"><h2>Subcon area assignments</h2><button class="primary" data-action="new-assignment">+ Assign location</button>${state.assignments.map(a=>`<div class="item">${esc(state.profiles.find(p=>p.user_id===a.user_id)?.display_name||a.user_id)} → ${esc(name(a.location_id))} <span class="small">${a.active?'Active':'Inactive'}</span><div><button data-action="toggle-assignment" data-id="${a.id}">${a.active?'Unassign':'Reactivate'}</button></div></div>`).join('')}</section></div>`}
function scoresPage(){return `<h1>Admin-only performance</h1><section class="card"><p class="hint">+1 per contractor-validated Subcon finding; −2 contractor-found High; −1 Medium; 0 Low. Missed findings are attributed to an assigned Subcon account.</p><div id="scoreResults"><button data-action="load-scores" class="primary">Load scores</button></div></section>`}
function reportsPage(){return `<h1>Daily report</h1><section class="card"><p>Use Print / Save as PDF for a manual report preview.</p><button data-action="report-preview" class="primary">Generate current-cycle report</button><p class="hint">Automatic 6 PM PDF email is not active in this build: it requires a scheduled server function and an approved email provider. The 6 PM checklist reset is automatic because each inspection is stored against its 18:00-to-18:00 cycle.</p></section>`}
async function mutate(table,mode,payload,id){let q=mode==='insert'?sb.from(table).insert(payload):mode==='update'?sb.from(table).update(payload).eq('id',id):sb.from(table).delete().eq('id',id);const {error}=await q;if(error)throw error;await load();toast('Saved')}
async function rpc(n,params){const {data,error}=await sb.rpc(n,params);if(error)throw error;await load();return data}
const options=(arr,idFn,textFn,chosen='')=>arr.map(v=>`<option value="${esc(idFn(v))}" ${idFn(v)===chosen?'selected':''}>${esc(textFn(v))}</option>`).join('');
function locationForm(l){modal(l?'Edit location':'Add location',`<form id="locationForm" data-id="${l?.id||''}"><div class="field"><label>Location / level name</label><input name="name" required value="${esc(l?.name||'')}" placeholder="PR 102 / Level 1"></div><div class="field"><label>Parent location (optional)</label><select name="parent_id"><option value="">Top-level location</option>${options(state.locations.filter(x=>x.id!==l?.id),x=>x.id,x=>x.name,l?.parent_id||'')}</select></div><div class="field"><label>Checklist template</label><select name="checklist_id"><option value="">No checklist (parent only)</option>${options(state.checklists,x=>x.id,x=>x.name,l?.checklist_id||'')}</select></div><button class="primary">Save location</button></form>`)}
function checklistForm(c){let q=state.questions.filter(x=>x.checklist_id===c?.id&&x.active).sort((a,b)=>a.position-b.position);modal(c?'Edit checklist':'New checklist',`<form id="templateForm" data-id="${c?.id||''}"><div class="field"><label>Checklist name</label><input name="name" required value="${esc(c?.name||'')}" placeholder="Pipe rack daily inspection"></div><div class="field"><label>Questions (one per line)</label><textarea name="questions" required rows="9" placeholder="Safe access provided?&#10;Scaffold inspected?">${esc(q.map(x=>x.prompt).join('\n'))}</textarea></div><p class="hint">Editing questions affects future submissions only. Previous answers retain the original question text, but changing templates during a live cycle should be avoided.</p><button class="primary">Save checklist</button></form>`)}
function userForm(p){modal('Manage user',`<form id="userForm" data-id="${p.user_id}"><p class="hint">Account: ${esc(p.user_id)}. Authentication accounts must be created/deleted in Supabase Auth dashboard.</p><div class="field"><label>Display name</label><input name="display_name" required value="${esc(p.display_name)}"></div><div class="field"><label>Role</label><select name="role">${['viewer','subcon','contractor','admin'].map(x=>`<option ${p.role===x?'selected':''}>${x}</option>`).join('')}</select></div><label class="radio"><input name="active" type="checkbox" ${p.active?'checked':''}> Active account</label><div><button class="primary">Save</button></div></form>`)}
function assignmentForm(){const ppl=state.profiles.filter(x=>x.role==='subcon'&&x.active);const ls=state.locations.filter(x=>x.active&&x.checklist_id);modal('Assign Subcon HSE',`<form id="assignmentForm"><div class="field"><label>Subcontractor HSE account</label><select name="user_id" required>${options(ppl,x=>x.user_id,x=>x.display_name)}</select></div><div class="field"><label>Checklist location / level</label><select name="location_id" required>${options(ls,x=>x.id,x=>x.name)}</select></div><button class="primary" ${!ppl.length||!ls.length?'disabled':''}>Assign</button></form>`)}
function findingForm(l){let ass=state.assignments.filter(a=>a.location_id===l.id&&a.active);modal('Contractor finding – '+l.name,`<form id="findingForm" data-id="${l.id}"><div class="field"><label>Observation</label><textarea name="description" required></textarea></div><div class="field"><label>Risk category</label><select name="category" required><option value="high">High</option><option value="medium">Medium</option><option value="low">Low</option></select></div><div class="field"><label>Subcon accountable for missed finding (if applicable)</label><select name="assigned_subcon"><option value="">Unattributed</option>${options(ass,x=>x.user_id,x=>state.profiles.find(p=>p.user_id===x.user_id)?.display_name||x.user_id)}</select></div><button class="primary">Save finding</button></form>`)}
function correctionForm(o){modal('Corrective action',`<form id="correctionForm" data-id="${o.id}"><div class="field"><label>Corrective action</label><textarea name="corrective_action" required>${esc(o.corrective_action||'')}</textarea></div><button class="primary">Submit correction</button></form>`)}
function validationForm(o){modal('Validate observation',`<form id="validationForm" data-id="${o.id}"><div class="field"><label>Finding validity</label><select name="valid"><option value="true" ${o.valid===true?'selected':''}>Valid (+1)</option><option value="false" ${o.valid===false?'selected':''}>Invalid (0)</option></select></div><div class="field"><label>Risk category</label><select name="category"><option value="">Not rated</option>${['high','medium','low'].map(x=>`<option value="${x}" ${o.category===x?'selected':''}>${x}</option>`).join('')}</select></div><button class="primary">Save validation</button></form>`)}
async function handler(action,id,target){switch(action){case 'modal-close':closeModal();break;case 'select-loc':selected=id;tab='locations';render();break;case 'open-checklist':checklistModal(id);break;case 'add-finding':findingForm(loc(id));break;case 'verify-inspection':if(confirm('Mark this submitted checklist as verified?')){await rpc('hw_verify_inspection',{p_inspection:id});toast('Checklist verified')}break;case 'correct':correctionForm(state.observations.find(x=>x.id===id));break;case 'validate':validationForm(state.observations.find(x=>x.id===id));break;case 'close':if(confirm('Confirm corrective action is verified and close observation?')){await rpc('hw_close_observation',{p_id:id});toast('Observation closed')}break;case 'new-location':locationForm();break;case 'edit-location':locationForm(loc(id));break;case 'delete-location':if(confirm('Delete this location? This will fail if historic records depend on it.'))await mutate('hw_locations','delete',null,id);break;case 'new-checklist':checklistForm();break;case 'edit-checklist':checklistForm(state.checklists.find(x=>x.id===id));break;case 'delete-checklist':if(confirm('Delete checklist? Existing historical answers may prevent deletion.'))await mutate('hw_checklists','delete',null,id);break;case 'edit-user':userForm(state.profiles.find(x=>x.user_id===id));break;case 'new-assignment':assignmentForm();break;case 'toggle-assignment':{let a=state.assignments.find(x=>x.id===id);await mutate('hw_assignments','update',{active:!a.active},id);break}case 'select-notification':await markNotification(id);selected=target.dataset.loc;tab='locations';render();break;case 'read-notification':await markNotification(id);break;case 'load-scores':{const{data,error}=await sb.rpc('hw_admin_scores');if(error)throw error;$('#scoreResults').innerHTML=`<div class="tablewrap"><table><thead><tr><th>Subcon HSE</th><th>Valid</th><th>Missed High</th><th>Missed Medium</th><th>Score</th></tr></thead><tbody>${data.map(x=>`<tr><td>${esc(x.display_name)}</td><td>${x.subcon_valid}</td><td>${x.missed_high}</td><td>${x.missed_medium}</td><td><b>${x.score}</b></td></tr>`).join('')}</tbody></table></div>`;break}case 'report-preview':showReport();break;}}
async function markNotification(id){const{error}=await sb.rpc('hw_mark_notification_read',{p_id:id});if(error)throw error;await load()}
function showReport(){let ins=state.inspections.filter(i=>i.cycle_day===cycle());let current=state.observations.filter(o=>{const d=new Date(o.created_at);return !isNaN(d)&&d>=new Date(cycle()+'T14:00:00Z')});let total=state.assignments.filter(a=>a.active).length;let html=`<h2>HSE WATCH — Daily inspection report</h2><p>Inspection cycle: ${cycle()}</p><p>Submitted checklists: ${ins.length} / active assignments: ${total}</p><p>Observations recorded this cycle: ${current.length}; open overall: ${state.observations.filter(x=>x.status==='open').length}</p><table><tr><th>Location</th><th>Source</th><th>Observation</th><th>Risk</th><th>Status</th></tr>${current.map(o=>`<tr><td>${esc(name(o.location_id))}</td><td>${esc(o.source)}</td><td>${esc(o.description)}</td><td>${esc(o.category||'—')}</td><td>${esc(o.status)}</td></tr>`).join('')}</table>`;modal('Report preview',`${html}<button onclick="window.print()">Print / Save PDF</button><p class="hint">This is a manual print preview, not the automatic 6 PM emailed report.</p>`)}
async function submitForm(e){let f=e.target;if(!f.matches('form'))return;e.preventDefault();let v=Object.fromEntries(new FormData(f));try{if(f.id==='configForm'){if(!/^https:\/\/.+\.supabase\.co\/?$/.test(v.url.trim()))throw Error('Please enter a valid Supabase project URL');if(!v.key.startsWith('sb_publishable_')&&!v.key.startsWith('eyJ'))throw Error('Enter a publishable or legacy anon key, not a secret key');localStorage.setItem('hw_config',JSON.stringify({url:v.url.trim().replace(/\/$/,''),key:v.key.trim()}));closeModal();await boot();return}
if(f.id==='loginForm'){if(!sb)throw Error('Configure Supabase connection first');const{data,error}=await sb.auth.signInWithPassword({email:v.email,password:v.password});if(error)throw error;user=data.user;await load();return}
if(f.id==='locationForm'){const payload={name:v.name.trim(),parent_id:v.parent_id||null,checklist_id:v.checklist_id||null};await mutate('hw_locations',f.dataset.id?'update':'insert',payload,f.dataset.id);closeModal();return}
if(f.id==='templateForm'){if(!v.name.trim())throw Error('Checklist name required');const items=v.questions.split('\n').map(x=>x.trim()).filter(Boolean);if(!items.length)throw Error('Add at least one question');let checklistId=f.dataset.id;if(checklistId){await mutate('hw_checklists','update',{name:v.name.trim()},checklistId);const ids=state.questions.filter(x=>x.checklist_id===checklistId);for(const q of ids){const{error}=await sb.from('hw_questions').update({active:false}).eq('id',q.id);if(error)throw error}}else{const{data,error}=await sb.from('hw_checklists').insert({name:v.name.trim()}).select('id').single();if(error)throw error;checklistId=data.id}const {error}=await sb.from('hw_questions').insert(items.map((prompt,position)=>({checklist_id:checklistId,prompt,position})));if(error)throw error;await load();closeModal();return}
if(f.id==='userForm'){const{error}=await sb.from('hw_profiles').update({display_name:v.display_name,role:v.role,active:!!f.elements.active.checked}).eq('user_id',f.dataset.id);if(error)throw error;await load();closeModal();return}
if(f.id==='assignmentForm'){let a=state.assignments.find(x=>x.user_id===v.user_id&&x.location_id===v.location_id);if(a){await mutate('hw_assignments','update',{active:true},a.id)}else await mutate('hw_assignments','insert',{user_id:v.user_id,location_id:v.location_id,active:true});closeModal();return}
if(f.id==='findingForm'){await rpc('hw_add_contractor_observation',{p_location:f.dataset.id,p_description:v.description,p_category:v.category,p_assigned_subcon:v.assigned_subcon||null});closeModal();return}
if(f.id==='correctionForm'){await rpc('hw_submit_correction',{p_id:f.dataset.id,p_correction:v.corrective_action});closeModal();return}
if(f.id==='validationForm'){await rpc('hw_set_observation_validity',{p_id:f.dataset.id,p_valid:v.valid==='true',p_category:v.category||null});closeModal();return}
if(f.id==='checklistForm'){const arr=[];for(const box of f.querySelectorAll('.question')){const value=box.querySelector('input[type=radio]:checked');if(!value)throw Error('Answer all questions');let yes=value.value==='yes',desc=box.querySelector('.desc').value.trim(),resp=box.querySelector('.resp').value.trim();if(!yes&&(!desc||!resp))throw Error('Observation and responsible person required for every No');arr.push({question_id:box.dataset.qid,yes,description:yes?'':desc,responsible_person:yes?'':resp})}await rpc('hw_submit_checklist',{p_location:f.dataset.location,p_answers:arr});closeModal();toast('Checklist submitted successfully');return}}
catch(err){toast('Error: '+err.message);console.error(err)}}
document.addEventListener('submit',submitForm);document.addEventListener('change',e=>{if(e.target.type==='radio'&&e.target.closest('.question')){const box=e.target.closest('.question'),no=box.querySelector('.noFields');no.hidden=e.target.value!=='no';for(const field of no.querySelectorAll('textarea,input'))field.required=e.target.value==='no'}if(e.target.id==='obsFilter'){const val=e.target.value;for(const x of document.querySelectorAll('#obsResults > div'))x.hidden=val!=='all'&&(val==='high'?x.dataset.high!=='true':x.dataset.status!==val)}});
document.addEventListener('input',e=>{if(e.target.id==='locSearch'){const term=e.target.value.trim().toLowerCase();$('#locResults').innerHTML=state.locations.filter(l=>l.active&&l.name.toLowerCase().includes(term)&&(term||!l.parent_id)).map(locationItem).join('')||'<div class="empty">No matching location</div>'}});
document.addEventListener('click',async e=>{let t=e.target.closest('[data-tab],[data-action]');if(!t)return;try{if(t.dataset.tab){tab=t.dataset.tab;render();return}await handler(t.dataset.action,t.dataset.id,t)}catch(err){toast('Error: '+err.message);console.error(err)}});
$('#configBtn').addEventListener('click',showConfig);$('#logoutBtn').addEventListener('click',async()=>{await sb.auth.signOut();user=null;profile=null;renderLogin()});
await boot();setInterval(async()=>{if(user){try{state.notifications=await query('hw_notifications');nav()}catch{}}},60000);
</script></body></html>
